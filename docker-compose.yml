services:
  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ─── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Backend (Go + Fiber) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DB_URL=postgres://postgres:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/${POSTGRES_DB:-portfolio}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY:-}
      - BINANCE_WS_URL=wss://stream.binance.com:9443/ws
      - TCBS_BASE_URL=https://apipubaws.tcbs.com.vn
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── AI Service (Python + FastAPI) ────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DB_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/${POSTGRES_DB:-portfolio}
      - REDIS_URL=redis://redis:6379
      - WORKERS=${AI_WORKERS:-2}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ─── TimescaleDB (PostgreSQL time-series) ─────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: postgres
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ─── Redis (Cache + Pub/Sub) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped

volumes:
  timescale_data:
  redis_data:
